name: Docker Build And Push

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/docker-build-push.yml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "frontend/**"
      - "scripts/**"
      - "src/**"
      - "extensions/openclaw-cao-tools/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build And Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      REGISTRY: ${{ vars.DOCKER_REGISTRY }}
      IMAGE_REPOSITORY: ${{ vars.DOCKER_IMAGE_REPOSITORY }}
      CAO_UID: ${{ vars.DOCKER_CAO_UID || '1000' }}
      CAO_GID: ${{ vars.DOCKER_CAO_GID || '1000' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Publish Config
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${REGISTRY}" ]]; then
            echo "Missing repository variable DOCKER_REGISTRY" >&2
            exit 1
          fi

          if [[ -z "${IMAGE_REPOSITORY}" ]]; then
            echo "Missing repository variable DOCKER_IMAGE_REPOSITORY" >&2
            exit 1
          fi

          if [[ -z "${{ secrets.DOCKER_USERNAME }}" ]]; then
            echo "Missing repository secret DOCKER_USERNAME" >&2
            exit 1
          fi

          if [[ -z "${{ secrets.DOCKER_PASSWORD }}" ]]; then
            echo "Missing repository secret DOCKER_PASSWORD" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Build Frontend Static Assets
        run: npm --prefix frontend run build

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login To Private Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build And Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CAO_UID=${{ env.CAO_UID }}
            CAO_GID=${{ env.CAO_GID }}